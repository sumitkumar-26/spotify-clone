<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A Spotify-inspired music player built with HTML, CSS and JavaScript"
    >

    <title>Spotify Clone - Music Player</title>

    <link rel="stylesheet" href="spotify.css">
</head>

<body>

    <!--  NAVBAR  -->

    <header class="navbar">

        <nav class="navbar-container">

            <a href="/" class="brand">
                <img
                    src="Spotify Clone/logo.jpg"
                    alt="Spotify Clone Logo"
                >

                <span>Spotify</span>
            </a>

            <ul class="nav-links">
                <li>
                    <a href="#">Home</a>
                </li>

                <li>
                    <a href="#">About</a>
                </li>
            </ul>

        </nav>

    </header>


    <!--  MAIN CONTENT  -->

    <main class="main-container">

        <!-- Song List -->

        <section class="song-list">

            <h1>Best of NCS - No Copyright Sounds</h1>

            <div class="song-item-container">

                <!-- JavaScript will generate songs here -->

            </div>

        </section>


        <!-- Right Side Banner -->

        <aside class="song-banner">
        </aside>

    </main>


    <!--  MUSIC PLAYER  -->

    <footer class="music-player">

        <!-- Progress Bar -->

        <input
            type="range"
            id="progress-bar"
            min="0"
            max="100"
            value="0"
            aria-label="Song progress"
        >


        <!-- Player Controls -->

        <div class="player-controls">

            <button
                type="button"
                id="previous"
                aria-label="Previous song"
            >
                <i class="fa-solid fa-backward-step"></i>
            </button>


            <button
                type="button"
                id="master-play"
                aria-label="Play or pause"
            >
                <i class="fa-solid fa-play"></i>
            </button>


            <button
                type="button"
                id="next"
                aria-label="Next song"
            >
                <i class="fa-solid fa-forward-step"></i>
            </button>

        </div>


        <!-- Current Song -->

        <div class="song-info">

            <img
                src="Spotify Clone/playing.gif"
                alt=""
                id="playing-gif"
            >

            <span id="master-song-name">
                Select a song
            </span>

        </div>

    </footer>


    <!-- Font Awesome -->

    <script
        src="https://kit.fontawesome.com/5a7bd537be.js"
        crossorigin="anonymous"
    ></script>

    <!-- JavaScript -->

    <script src="spotify.js"></script>

</body>

</html>
